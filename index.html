<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cradle to Cosmos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the world map fills the screen like a toy globe unrolled; chunky HUD chips float on top, a pill tab bar sits at the thumb. */
:root {
  --ink: #1d2a4d;
  --ink-2: #4b5878;
  --paper: #ffffff;
  --panel: #f4f8fc;
  --line: #d5deea;
  --sea: #6fc3ea;
  --accent: #ff7a3d;
  --accent-d: #d85a20;
  --good: #23a45f;
  --warn: #e69a0b;
  --bad: #e5484d;
  --gold: #f2b134;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
  --pop: 0 4px 0 rgba(29, 42, 77, .9);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sea); color: var(--ink); font: 500 15px/1.35 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h2, h3, h4 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

#game { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#game.dim .hud, #game.dim .nav, #game.dim .zoom { display: none; }

/* HUD */
.hud { position: absolute; top: 0; left: 0; right: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); pointer-events: none; display: grid; gap: 6px; }
.hud > * { pointer-events: auto; }
.title-row { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 6px 10px; box-shadow: var(--pop); max-width: 560px; min-width: 0; }
#hFlag { width: 22px; height: 22px; border-radius: 7px; border: 2.5px solid var(--ink); flex-shrink: 0; }
.title-row .tt { min-width: 0; }
#hName { font: 600 16px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hYear { font-size: 12px; color: var(--ink-2); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; max-width: 100%; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 12px; padding: 3px 9px 3px 6px; box-shadow: 0 3px 0 rgba(29,42,77,.9); }
.chip .ci { grid-row: span 2; font-size: 18px; }
.chip b { font: 600 15px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.chip i { font-style: normal; font-size: 11px; font-weight: 800; color: var(--ink-2); line-height: 1.1; white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
.chip i.neg { color: var(--bad); }
.chip.good { background: #e3f7ea; } .chip.bad { background: #ffe3e3; }
.chip.warnchip { background: #fff0c2; }
.chip.alert { background: #fff0c2; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: translateY(-2px); } }

.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); display: grid; gap: 8px; }
.zoom button { width: 42px; height: 42px; border-radius: 12px; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 rgba(29,42,77,.9); font: 600 20px var(--display); display: grid; place-items: center; }
#zsim { flex-direction: column; font-size: 16px; line-height: 1; }
#zsim small { display: block; font: 800 9px var(--body); }
.choice.simf { display: block; cursor: pointer; }
.choice.simf input { float: right; width: 20px; height: 20px; accent-color: var(--accent); }
.choice.simf:has(input:checked) { background: #fff3e8; border-color: var(--accent); }
.simbar { height: 14px; margin: 10px 0; }
.simbar i { background: var(--accent); }
.center { text-align: center; }

/* bottom nav */
.nav { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; align-items: flex-end; pointer-events: none; z-index: 6; }
.nav > * { pointer-events: auto; }
.tabs { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: var(--pop); overflow: hidden; max-width: 460px; }
.tab { border: 0; background: none; padding: 7px 0 6px; display: grid; justify-items: center; gap: 1px; font: 700 9px var(--body); position: relative; min-width: 0; letter-spacing: -.02em; overflow: hidden; }
.tab span { font-size: 19px; line-height: 1.1; }
.tab.on { background: #ffe6d8; }
.tab.alert::after { content: ""; position: absolute; top: 6px; right: 22%; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); border: 2px solid var(--paper); }
#endTurn { border: 2.5px solid var(--ink); background: var(--accent); color: #fff; border-radius: 18px; box-shadow: var(--pop); padding: 8px 10px; font: 600 15px/1.05 var(--display); min-width: 78px; min-height: 56px; text-shadow: 0 1.5px 0 var(--accent-d); }
#endTurn small { display: block; font: 800 10px var(--body); opacity: .9; letter-spacing: .08em; text-transform: uppercase; }
#endTurn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#endTurn.busy { filter: saturate(.4); }

/* sheets & panels */
.sheet, .panel { position: absolute; left: 0; right: 0; margin: 0 auto; max-width: 560px; background: var(--panel); border: 2.5px solid var(--ink); border-radius: 22px 22px 0 0; border-bottom: 0; z-index: 5; overflow-y: auto; overscroll-behavior: contain; padding: 14px max(16px, env(safe-area-inset-left, 0px)) 92px max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -6px 24px rgba(29,42,77,.18); animation: up .22s ease-out; }
.sheet { bottom: 0; max-height: 62%; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); }
.panel { bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sh-head, .p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sh-head h3 { font-size: 24px; }
.p-head h2 { font-size: 26px; display: flex; align-items: center; gap: 8px; }
.sub { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.x { border: 2.5px solid var(--ink); background: var(--paper); border-radius: 12px; width: 38px; height: 38px; flex-shrink: 0; font-weight: 800; }
.owner { display: flex; align-items: center; gap: 8px; font-weight: 800; margin: 4px 0 10px; flex-wrap: wrap; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 5px; border: 2px solid var(--ink); vertical-align: -2px; }
.sw.big { width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; }
.pill { display: inline-block; font: 800 11px var(--body); padding: 2px 8px; border-radius: 99px; background: #e5ecf6; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
.pill.bad { background: var(--bad); color: #fff; } .pill.good { background: var(--good); color: #fff; }
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px; }
.stats4 > div { background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; min-width: 0; }
.stats4 small { display: block; font-size: 10.5px; font-weight: 800; color: var(--ink-2); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats4 b { font: 600 18px var(--display); font-variant-numeric: tabular-nums; }
.stats4 b span { font-size: 12px; color: var(--ink-2); }
.bar-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; margin: 6px 0; }
.bar { display: block; height: 10px; background: #e2e9f2; border-radius: 99px; overflow: hidden; border: 2px solid var(--ink); min-width: 40px; }
.bar i { display: block; height: 100%; border-radius: 99px; }
.bar.big { height: 16px; }
h4 { font-size: 17px; margin: 14px 0 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card h4 { margin-top: 0; }
.blds { display: flex; flex-wrap: wrap; gap: 6px; }
.bchip { background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 3px 8px; font-weight: 700; font-size: 13px; }
.bchip.building { border-style: dashed; border-color: var(--accent); }
.note { background: #fff7e0; border: 2px solid #f3d27b; border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; margin: 8px 0; }
.note.warn { background: #ffe9e0; border-color: #f5a98a; }
.opts { display: grid; gap: 8px; margin-top: 4px; }
.opt { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; text-align: left; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 10px; box-shadow: 0 3px 0 var(--ink); }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.opt:disabled { opacity: .5; box-shadow: none; cursor: default; }
.opt .oi { font-size: 24px; text-align: center; }
.opt .ot { min-width: 0; }
.opt .ot b { display: block; font: 600 16px var(--display); }
.opt .ot small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 700; }
.opt .oc { display: grid; gap: 2px; justify-items: end; font-weight: 800; font-size: 13px; white-space: nowrap; }
.opt.war { background: #ffecec; }
.cg, .cm { font-variant-numeric: tabular-nums; }
.card { background: var(--paper); border: 2.5px solid var(--ink); border-radius: var(--r); padding: 12px; margin: 10px 0; }
.card.offer { background: #e8f8ee; }
.ln { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1.5px dashed var(--line); font-size: 14px; }
.ln:last-child { border-bottom: 0; }
.ln span { color: var(--ink-2); font-weight: 700; min-width: 0; }
.ln b { text-align: right; font-variant-numeric: tabular-nums; }
.ln.total { border-top: 2px solid var(--ink); border-bottom: 0; margin-top: 4px; padding-top: 7px; }
.ln.good b { color: var(--good); } .ln.bad b, .ln.bad span { color: var(--bad); }
.ln.me { background: #fff0e6; border-radius: 8px; padding-inline: 6px; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.row.wrap { flex-wrap: wrap; }
.row .btn { flex: 1; }
.btn { border: 2.5px solid var(--ink); background: var(--accent); color: #fff; border-radius: 14px; padding: 11px 14px; font: 600 16px var(--display); box-shadow: 0 3px 0 var(--ink); text-shadow: 0 1px 0 var(--accent-d); }
.btn.small { font-size: 13px; padding: 7px 10px; flex: 0 1 auto; }
.btn.ghost { background: var(--paper); color: var(--ink); text-shadow: none; }
.btn.red { background: var(--bad); text-shadow: none; }
.btn:disabled { opacity: .45; box-shadow: none; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn .cg, .btn .cm { font-family: var(--body); font-weight: 800; }
.back { margin-bottom: 4px; }
.rlist { display: grid; gap: 6px; }
.rl { display: flex; justify-content: space-between; gap: 8px; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 7px 10px; font-weight: 800; }
.rl small { color: var(--ink-2); font-weight: 700; white-space: nowrap; }
.past summary { cursor: pointer; list-style: none; margin-top: 18px; }
.past summary::before { content: "▸ "; }
.past[open] summary::before { content: "▾ "; }
.era-h { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin-top: 18px; }
.techs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tech { position: relative; overflow: hidden; text-align: left; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 10px 9px; display: grid; gap: 2px; box-shadow: 0 3px 0 var(--ink); }
.tech b { font: 600 15px var(--display); }
.tech small { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.tech .tc { font-size: 12px; font-weight: 800; margin-top: 2px; }
.tech.done { background: #e3f7ea; border-color: #8fd3a8; box-shadow: none; }
.tech.done .tc { color: var(--good); }
.tech.cur { background: #fff0e6; border-color: var(--accent); }
.tech.locked { opacity: .5; box-shadow: none; }
.tech .tp { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--accent); }
.toggle { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; margin: 8px 0; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.fac { border-bottom: 1.5px dashed var(--line); padding: 6px 0; }
.fac:last-child { border-bottom: 0; }
.fac summary { display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px 28px; gap: 8px; align-items: center; list-style: none; cursor: pointer; }
.fac summary::-webkit-details-marker { display: none; }
.fac .fi { font-size: 19px; }
.fac .fn { font-weight: 800; min-width: 0; }
.fac .fn small { display: block; font-size: 11px; color: var(--ink-2); }
.fac b { font: 600 16px var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.fac p { margin: 6px 0 2px 34px; }
.govs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gov { text-align: left; background: var(--panel); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 10px; display: grid; gap: 2px; }
.gov b { font: 600 15px var(--display); }
.gov small { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.gov .tc { font-size: 11px; font-weight: 800; color: var(--accent-d); }
.gov.cur { background: #fff0e6; border-color: var(--accent); }
.gov:disabled:not(.cur) { opacity: .55; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 2.5px solid var(--ink); background: var(--panel); border-radius: 12px; padding: 7px 10px; font-weight: 800; font-size: 13px; }
.seg button.on { background: var(--ink); color: #fff; }
.seg button:disabled:not(.on) { opacity: .45; }
.budget .bsum { margin-bottom: 6px; }
.budget .bl { margin: 10px 0 12px; }
.budget .bl label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; font-size: 14px; }
.budget .bl label b { font-size: 13px; white-space: nowrap; }
.budget input[type=range] { width: 100%; height: 30px; margin: 2px 0; accent-color: var(--accent); }
.budget .bx { font-size: 12px; opacity: .8; margin: 2px 0 0; line-height: 1.35; }
.budget .seg { margin-top: 6px; }
.budget .seg button { padding: 6px 8px; font-size: 12px; }
.budget .wh { margin: 14px 0 2px; }
.budget .bl.sub { margin-top: -4px; padding-left: 10px; border-left: 3px solid var(--accent); }
.budget .qq { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; opacity: .7; margin-top: -2px; }
.secrow { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 6px; margin: 6px 0; }
.secrow small { font-weight: 800; }
.secrow .seg button { padding: 5px 8px; font-size: 12px; }
.pill.bad { background: #fde3e1; color: var(--bad); }
.pill.good { background: #def5e4; color: var(--good); }
.rec { background: #eef5ff; border-left: 3px solid #4a86d9; border-radius: 8px; padding: 6px 9px; font-size: 12.5px; line-height: 1.35; margin: 6px 0 2px; }
.rec:empty { display: none; }
.rec small { font-size: 12px; opacity: .9; }
.madein { background: rgba(29,42,77,.05); border-radius: 10px; padding: 6px 9px; margin: 8px 0; }
.madein .ln { font-size: 13px; }
.fld { display: grid; gap: 4px; font-weight: 800; font-size: 14px; margin: 10px 0 4px; }
.fld input, .fld select, .fld textarea { font: 600 15px var(--body); border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 10px; background: #fff; width: 100%; box-sizing: border-box; }
.fld textarea { resize: vertical; }
.need { padding: 6px 0 10px; border-bottom: 1px dashed rgba(29,42,77,.15); }
.need:last-child { border-bottom: 0; }
.askrow.simgo { background: #fff3e8; border: 2px solid var(--accent); border-radius: 12px; padding: 8px 10px; margin-top: 12px; }
.compass { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 260px; margin: 6px 0; }
.compass button { border: 2.5px solid var(--ink); background: var(--panel); border-radius: 12px; padding: 8px 4px; font: 800 15px var(--body); }
.compass button.on { background: var(--ink); color: #fff; }
.compass button:nth-child(5) { font-size: 11px; }
.askrow { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; margin: 8px 0; }
.nat { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 9px 10px; margin-bottom: 8px; box-shadow: 0 3px 0 var(--ink); }
.nat .nt { min-width: 0; }
.nat .nt b { display: block; font: 600 16px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nat .nt small { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.nat .ns { display: grid; justify-items: end; gap: 2px; font-size: 12px; font-weight: 800; white-space: nowrap; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(20, 34, 66, .55); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mbox { background: var(--paper); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); padding: 20px 18px 16px; width: min(440px, 100%); max-height: 100%; overflow-y: auto; animation: popin .25s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes popin { from { transform: scale(.85); opacity: 0; } }
.mbox h2 { font-size: 28px; text-align: center; }
.mbox p { margin: 10px 0; }
.mi { font-size: 52px; text-align: center; line-height: 1; margin-bottom: 4px; }
.choices { display: grid; gap: 10px; margin-top: 14px; }
.choice { text-align: left; background: var(--panel); border: 2.5px solid var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 0 3px 0 var(--ink); }
.choice b { display: block; font: 600 17px var(--display); }
.choice small { font-weight: 700; color: var(--ink-2); }
.choice:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.news { display: grid; gap: 8px; margin-top: 10px; }
.nw { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; background: var(--panel); border-radius: 12px; padding: 8px 10px; }
.nw span { font-size: 20px; line-height: 1.2; }
.nw p { margin: 0; font-weight: 700; font-size: 14px; }
.nw.far { opacity: .75; background: transparent; border: 2px dashed var(--line); }
.slider { display: grid; gap: 6px; font-weight: 800; margin: 12px 0; }
.slider input { width: 100%; accent-color: var(--accent); height: 28px; }
.odds { display: grid; gap: 6px; text-align: center; font-family: var(--display); font-size: 18px; }
.help p { margin: 8px 0; font-size: 14px; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 120px); transform: translate(-50%, -10px); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 14px; font: 600 15px var(--display); z-index: 40; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* title & setup */
.screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(29,42,77,.1), rgba(29,42,77,.45)); overflow-y: auto; }
.tbox { width: min(420px, 100%); display: grid; gap: 12px; text-align: center; }
.logo { font: 700 clamp(44px, 13vw, 68px)/.9 var(--display); color: #fff; letter-spacing: .01em; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); transform: rotate(-3deg); margin: 0 0 6px; }
.logo span { display: block; color: var(--gold); font-size: .62em; transform: translateX(14%); }
.tag { margin: 0 auto 8px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-weight: 800; box-shadow: var(--pop); max-width: 340px; }
.big-btn { display: grid; gap: 2px; padding: 14px; font-size: 20px; }
.big-btn small { font: 800 12px var(--body); opacity: .9; }
.setup-box { width: min(480px, 100%); background: var(--panel); border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 6px 0 var(--ink); padding: 16px; max-height: 100%; overflow-y: auto; align-self: end; }
.setup-box h2 { font-size: 26px; }
.field { display: grid; gap: 6px; margin-top: 12px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.namebox { display: flex; gap: 6px; }
.namebox input { flex: 1; min-width: 0; border: 2.5px solid var(--ink); border-radius: 12px; padding: 10px 12px; font: 600 18px var(--display); color: var(--ink); background: var(--paper); }
.namebox button { border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); width: 46px; font-size: 20px; }
#sColors { display: flex; flex-wrap: wrap; gap: 8px; }
.sw.pick { width: 34px; height: 34px; border-radius: 10px; border-width: 2.5px; }
.sw.pick.on { outline: 3px solid var(--ink); outline-offset: 2px; }
#sStarts { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
#sStarts button, #sDiff button { flex-shrink: 0; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 7px 10px; font-weight: 800; font-size: 13px; text-transform: none; letter-spacing: 0; }
#sStarts button.on, #sDiff button.on { background: var(--ink); color: #fff; }
#sDiff { display: flex; gap: 6px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.chiprow button { border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); padding: 6px 9px; font-weight: 800; font-size: 13px; text-transform: none; letter-spacing: 0; }
.chiprow button.on { background: var(--ink); color: #fff; }
.culinfo { font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 700; }
#sDiff button { flex: 1; }
#sInfo { font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 700; }
.sets { display: grid; gap: 8px; }
.set { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; display: grid; gap: 6px; }
.set.mine { border-color: var(--ink); }
.st-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.st-icon { font-size: 24px; line-height: 1; }
.st-name { min-width: 0; flex: 1; }
.st-name b { display: block; font: 600 16px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-name small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.st-pop { text-align: right; font: 600 17px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.st-pop small { display: block; font: 700 11px var(--body); color: var(--ink-2); }
.bar.thin { height: 8px; border-width: 1.5px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.why { font-size: 12px; font-weight: 700; color: var(--ink-2); flex-basis: 100%; }
.claim { background: var(--paper); border: 2px dashed var(--accent); border-radius: 14px; padding: 6px 10px; margin-bottom: 8px; }
.claim p { margin: 2px 0 4px; }
.tiers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.tiers > div { background: var(--panel); border-radius: 12px; padding: 6px; display: grid; justify-items: center; }
.tiers span { font-size: 22px; }
.tiers b { font: 600 20px var(--display); }
.tiers.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiers small { font-size: 11px; font-weight: 800; color: var(--ink-2); }
.fcard h4 > span:first-child { font-size: 20px; }
.fcard h4 .pill { font-size: 10px; }
.fcard.branch { margin-left: 14px; border-left-width: 5px; }
.fcard.locked-b { border-style: dashed; opacity: .75; }
.emtag { font-size: 12px; font-weight: 800; color: var(--accent-d); margin: -4px 0 8px; }
.emph { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; }
.emph select { font: 700 13px var(--body); border: 2px solid var(--ink); border-radius: 10px; padding: 5px 6px; background: var(--paper); color: var(--ink); max-width: 190px; }
.fcard .from { font-size: 11px; font-weight: 800; color: var(--good); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.fcard p { margin: 0 0 8px; }
.stages { display: grid; gap: 6px; }
.stage { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; }
.stage.locked { border-style: dashed; opacity: .7; }
.stage b { font: 600 15px var(--display); }
.stage small { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.stage .btn { justify-self: start; }
.st-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pips { display: flex; gap: 4px; flex-shrink: 0; }
.pips i { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--ink); background: var(--paper); }
.pips i.on { background: var(--accent); }
.pips i.key { box-shadow: 0 0 0 2px #ffd36b; }
[hidden] { display: none !important; }
@media (min-width: 700px) { .sheet { max-height: 70%; } }
@media (prefers-reduced-motion: reduce) { .sheet, .panel, .mbox, .chip.alert { animation: none; } }
</style>
</head>
<body>
<div id="game" class="dim">
  <canvas id="map" aria-label="World map"></canvas>
  <div class="hud">
    <div class="title-row"><span id="hFlag"></span><div class="tt"><div id="hName">—</div><div id="hYear"></div></div></div>
    <div class="chips">
      <button class="chip" id="cPop" data-open="nation" aria-label="Population"></button>
      <button class="chip" id="cGold" data-open="nation" aria-label="Gold"></button>
      <button class="chip" id="cMat" data-open="nation" aria-label="Materials"></button>
      <button class="chip" id="cFood" data-open="nation" aria-label="Food"></button>
      <button class="chip" id="cSci" data-open="research" aria-label="Research"></button>
      <button class="chip" id="cStab" data-open="policy" aria-label="Stability"></button>
      <button class="chip" id="cArmy" data-open="nation" aria-label="Army"></button>
    </div>
  </div>
  <div class="zoom"><button id="zsim" aria-label="Simulate 10 years">⏩<small>10y</small></button><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zhome" aria-label="Go to capital">⭐</button></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="panel" id="panel" hidden></div>
  <div class="nav">
    <div class="tabs">
      <button class="tab" data-p="nation"><span>🏛️</span>Nation</button>
      <button class="tab" data-p="develop"><span>🏗️</span>Develop</button>
      <button class="tab" data-p="research"><span>🔬</span>Research</button>
      <button class="tab" data-p="trade"><span>⚖️</span>Trade</button>
      <button class="tab" data-p="army"><span>⚔️</span>Army</button>
      <button class="tab" data-p="policy"><span>📜</span>Laws</button>
      <button class="tab" id="tabWorld" data-p="world"><span>🌍</span>World</button>
    </div>
    <button id="endTurn">End Turn<small>Next ›</small></button>
  </div>
</div>

<div class="screen" id="title">
  <div class="tbox">
    <h1 class="logo">Cradle<span>to Cosmos</span></h1>
    <p class="tag">Grow one village of 30 people into an empire, and then reach for Mars.</p>
    <button class="btn big-btn" id="btnContinue" hidden>Continue<small></small></button>
    <button class="btn big-btn" id="btnNew">New nation<small>Pick a homeland on the real world map</small></button>
    <button class="btn ghost" id="btnHelp">How to play</button>
  </div>
</div>

<div class="screen" id="setup" hidden>
  <div class="setup-box">
    <h2>Found your village</h2>
    <label class="field">Name your people
      <span class="namebox"><input id="sName" maxlength="18" autocomplete="off"><button id="sRandomName" type="button" aria-label="Random name">🎲</button></span>
    </label>
    <div class="field">Colors<div id="sColors"></div></div>
    <div class="field">Homeland <span class="muted" style="text-transform:none;letter-spacing:0">(or tap any land on the map)</span><div id="sStarts"></div><div id="sInfo"></div></div>
    <div class="field">Culture<div id="sCul" class="chiprow"></div><div id="sCulInfo" class="culinfo"></div></div>
    <div class="field">Rivals<div id="sDiff"><button data-d="0">Gentle</button><button data-d="1">Normal</button><button data-d="2">Ruthless</button></div></div>
    <div class="row"><button class="btn ghost" id="sBack">Back</button><button class="btn" id="sGo">Begin the Stone Age</button></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="mbox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="world.js"></script>
<script src="game.js"></script>
<script>
document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
  const t = document.querySelector(`.tab[data-p="${b.dataset.open}"]`); if (t) t.click();
}));
</script>
</body>
</html>
